name: "SupremeAI Single-Source Auto-Build & Release (Web + Desktop + Android)"

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "packages/**"
      - "src-tauri/**"
      - "server.ts"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-all.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (leave empty for rolling 'latest' build)"
        required: false
        default: ""
      publish_release:
        description: "Publish unified GitHub Release with Web + Desktop + Android artifacts"
        required: true
        type: boolean
        default: true
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: supremeai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    name: "1/3 Build & Deploy Web Studio"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Sync Version & Build Web Bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run version:sync
          npm run build:web
          tar -czf supremeai-web-dist.tar.gz dist/

      - name: Deploy to Cloudflare Pages (if secrets configured)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'supremeai-studio' }}

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-bundle
          path: supremeai-web-dist.tar.gz
          if-no-files-found: error

  build-desktop-windows:
    name: "2/3 Auto-Build Desktop Installers (Windows NSIS & MSI)"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Sync Version & Build Shared App Bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run version:sync
          npm run build:app

      - name: Build Tauri NSIS & MSI Installers
        shell: bash
        run: npx tauri build --config src-tauri/tauri.conf.json

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-android-tauri-apk:
    name: "3/3 Auto-Build Tauri v2 Android APK (Same React UI + Rust Core)"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK 21 (Required by Tauri v2 Gradle 9 + AGP 9)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Pre-installed Android SDK, Licenses & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "${SDKMANAGER:-}" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-37" ]; then
              "$SDKMANAGER" "platforms;android-37" || true
            fi
          fi

          NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            if [ -n "${SDKMANAGER:-}" ]; then
              "$SDKMANAGER" "ndk;27.0.12077973"
              NDK_DIR="$SDK_DIR/ndk/27.0.12077973"
            else
              echo "::error::Android NDK not found and sdkmanager unavailable"
              exit 1
            fi
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using Java: $(java -version 2>&1 | head -n 1)"
          echo "Using Android SDK: $SDK_DIR"
          echo "Using Android NDK: $NDK_DIR"

      - name: Setup Rust toolchain (Android arm64 + armv7)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Sync Version & Build Shared App Bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run version:sync
          npm run build:app

      - name: Initialize & Build Tauri v2 Android Release APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          npx tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Sign Android APK (v2/v3 apksigner for Android 11-15+)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-apks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::Android build-tools with apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/supremeai-release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
          else
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -storepass android -alias supremeai -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SupremeAI Studio,O=SupremeAI,C=BD"
            KS_PASS="android"
            KEY_ALIAS="supremeai"
            KEY_PASS="android"
          fi

          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            BASENAME=$(basename "$apk" .apk)
            ALIGNED="$RUNNER_TEMP/${BASENAME}-aligned.apk"
            SIGNED="release-apks/SupremeAI-Studio-${BASENAME%-unsigned}.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED" \
              "$ALIGNED"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk")

          APK_COUNT=$(find release-apks -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No signed APKs were generated in release-apks/"
            exit 1
          fi
          ls -lh release-apks/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-apks/*.apk
          if-no-files-found: error

  publish-unified-release:
    name: "Publish Coordinated Release (Web + Desktop + Android)"
    needs: [build-web, build-desktop-windows, build-android-tauri-apk]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All 3 Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Release Tag & Prerelease Mode
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
            echo "title=SupremeAI Studio ${GITHUB_REF_NAME} (Web + Desktop + Android)" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            echo "tag=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
            echo "is_pre=${{ inputs.prerelease || false }}" >> "$GITHUB_OUTPUT"
            echo "title=SupremeAI Studio ${{ inputs.release_version }} (Web + Desktop + Android)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
            echo "title=SupremeAI Studio Latest Build (Web + Desktop + Android)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Single Coordinated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.is_pre }}
          generate_release_notes: true
          make_latest: ${{ steps.version.outputs.is_pre == 'false' && 'true' || 'false' }}
          files: |
            release-artifacts/release-web-bundle/*.tar.gz
            release-artifacts/release-desktop-windows/**/*.exe
            release-artifacts/release-desktop-windows/**/*.msi
            release-artifacts/release-android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
