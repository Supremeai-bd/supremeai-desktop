name: "SupremeAI Android APK Build & Release"

on:
  push:
    tags:
      - "android-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (debug, release, or both)"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "release"
          - "debug"
      release_version:
        description: "Release Version Tag (e.g. v2.5.0)"
        required: false
        default: "v2.5.0"
      publish_release:
        description: "Publish to GitHub Releases"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android APK (apps/mobile-android)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-android
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android Build Environment
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SupremeAI Debug,O=SupremeAI,C=BD"
          fi

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-studio-apk
          path: apps/mobile-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
