name: "SupremeAI Unified CI (Web + Desktop + Tauri Android)"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supremeai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: "Web Studio Typecheck & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck & Build Web Bundle
        shell: bash
        run: npm run build:web

  desktop-rust:
    name: "Desktop Tauri v2 (Windows Rust + React UI)"
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Install dependencies & build shared app bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build:app

      - name: Compile Rust Tauri backend
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

  android-tauri:
    name: "Android Tauri v2 APK (Single-Source React UI + Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Pre-installed Android SDK & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            if [ -n "${SDKMANAGER:-}" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "ndk;27.0.12077973"
              NDK_DIR="$SDK_DIR/ndk/27.0.12077973"
            else
              echo "::error::Android NDK not found and sdkmanager unavailable"
              exit 1
            fi
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_DIR"
          echo "Using Android NDK: $NDK_DIR"

      - name: Setup Rust toolchain (Android aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Install dependencies & build shared app bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build:app

      - name: Initialize Tauri Android target & compile Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          npx tauri android build --apk --debug --target aarch64 --ci

  auto-merge:
    name: "Auto-Merge PR (All 3 Platforms Gated)"
    needs: [web, desktop-rust, android-tauri]
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify all 3 platform gates and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEB_RES: ${{ needs.web.result }}
          DESKTOP_RES: ${{ needs.desktop-rust.result }}
          ANDROID_RES: ${{ needs.android-tauri.result }}
        run: |
          echo "Web Gate: $WEB_RES | Desktop Gate: $DESKTOP_RES | Android Gate: $ANDROID_RES"
          if [ "$WEB_RES" != "success" ] || [ "$DESKTOP_RES" != "success" ] || [ "$ANDROID_RES" != "success" ]; then
            echo "::error::One or more platform gates failed. Auto-merge blocked."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch || true
