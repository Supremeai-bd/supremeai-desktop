name: "Desktop CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: "Frontend typecheck & build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (lockfile must be in sync)
        run: npm ci

      - name: Typecheck & build
        run: npm run build

  auto-merge:
    name: "Auto-Merge PR (Gated)"
    needs: [web]
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify checks and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEB_RES: ${{ needs.web.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Web Gate: $WEB_RES"
          if [ "$WEB_RES" != "success" ]; then
            echo "::error::Required gate did not succeed. Auto-merge blocked."
            exit 1
          fi
          echo "All required gates 100% green."
          echo "Queueing autonomous squash landing to main for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch || true
